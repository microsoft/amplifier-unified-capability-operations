name: Capability contracts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
      - name: Install dependencies with scoped private-repository access
        env:
          # Repository-scoped checkout credentials cannot read this private peer.
          # Configure a read-only secret; never place credentials in source URLs.
          AMPLIFIER_DEPENDENCY_READ_TOKEN: ${{ secrets.AMPLIFIER_DEPENDENCY_READ_TOKEN }}
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.https://github.com/microsoft/amplifier-portability.helper
          GIT_CONFIG_VALUE_0: '!f() { if [ "$1" = get ]; then printf "%s\n" "username=x-access-token" "password=$AMPLIFIER_DEPENDENCY_READ_TOKEN"; fi; }; f'
          GIT_CONFIG_KEY_1: credential.useHttpPath
          GIT_CONFIG_VALUE_1: 'true'
        run: |
          if [ -z "$AMPLIFIER_DEPENDENCY_READ_TOKEN" ]; then
            echo "::error::Configure AMPLIFIER_DEPENDENCY_READ_TOKEN with read access to microsoft/amplifier-portability; dependency installation cannot proceed without it."
            exit 1
          fi
          uv sync --directory python --python 3.13 --locked
      - run: python/.venv/bin/python -m pytest -c python/pyproject.toml python/tests -q
      - run: npm test
